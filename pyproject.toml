[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo-dados"
version = "0.1.0"
description = "Laboratório pessoal de ciência de dados com foco no setor financeiro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
]
ml-advanced = [
  "lightgbm>=4.5,<5",
  "xgboost>=2.1,<4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
